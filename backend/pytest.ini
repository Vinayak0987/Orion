[pytest]
asyncio_mode = auto
testpaths = tests
python_files = test_*.py

# Default run: parallel across all cores, skipping slow/research suites.
# Run everything with:   pytest -m ""  -p no:cacheprovider  (or -o addopts="")
# Run only slow/research: pytest -m "slow or research"
addopts = -n auto -m "not slow and not research"

markers =
    slow: long-running or integration-style tests (skipped by default; run with -m slow)
    research: evaluation / paper / ablation harness tests, not the deployed app (skipped by default)
    allow_network: let a test open a real outbound/local socket (network guard steps aside)

filterwarnings =
    ignore::DeprecationWarning
