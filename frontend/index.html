<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MABGP — Business Plan Generator</title>
    <script>
      // Set the theme BEFORE first paint to avoid a flash of the wrong theme
      // (the intro + auth screens are dark; without this the page briefly shows
      // the light base theme before React mounts and applies the real theme).
      // Honour the user's previously saved choice; otherwise default to dark.
      (function () {
        try {
          var saved = localStorage.getItem("orion-theme");
          var valid = ["light", "dark-purple", "dark-black", "dark-gray"];
          var theme = valid.indexOf(saved) !== -1 ? saved : "dark-black";
          document.documentElement.setAttribute("data-theme", theme);
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "dark-black");
        }
      })();
    </script>
    <style>
      /* Dark base so the very first paint (before any React/CSS module loads)
         is never light. The intro and auth screens paint their own dark
         backgrounds on top; this just prevents a white flash underneath. */
      html { background: #0a0a0b; }
      html[data-theme="light"] { background: #f5f7fa; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
